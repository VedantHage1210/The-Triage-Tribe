services:
  - type: web
    name: triage-tribe-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.seed_data && python -m scripts.embed_knowledge_base && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: VECTOR_STORE_PATH
        value: ./chroma_store
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
